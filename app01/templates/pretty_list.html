{% extends 'layout.html' %}

{% block content %}
    <div class="container">
        <!-- 顶部操作栏：新建按钮 + 搜索框 -->
        <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
            <!-- 功能2：新建靓号 -->
            <a class="btn btn-success" href="/pretty/add/">
                <span class="glyphicon glyphicon-plus-sign" aria-hidden="true"></span>
                新建靓号
            </a>

            <!-- 功能5：右上角搜索框 (注意 method="get") -->
            <form method="get" class="form-inline">
                <div class="input-group">
                    <input type="text" class="form-control" name="q" placeholder="Search for..." value="{{ search_data }}">
                    <span class="input-group-btn">
                        <button class="btn btn-default" type="submit">
                            <span class="glyphicon glyphicon-search" aria-hidden="true"></span>
                        </button>
                    </span>
                </div>
            </form>
        </div>

        <!-- 数据表格 -->
        <div class="panel panel-default">
            <div class="panel-heading">
                <span class="glyphicon glyphicon-th-list" aria-hidden="true"></span>
                靓号列表
            </div>
            <table class="table table-bordered">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>号码</th>
                    <th>价格</th>
                    <th>级别</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                {% for obj in queryset %}
                    <tr>
                        <th>{{ obj.id }}</th>
                        <td>{{ obj.mobile }}</td>
                        <td>{{ obj.price }}</td>
                        <td>{{ obj.get_level_display }}</td>
                        <td>{{ obj.get_status_display }}</td>
                        <td>
                            <!-- 功能3：编辑 -->
                            <a class="btn btn-primary btn-xs" href="/pretty/{{ obj.id }}/edit/">编辑</a>
                            <!-- 功能4：删除 -->
                            <a class="btn btn-danger btn-xs" href="/pretty/delete/?nid={{ obj.id }}">删除</a>
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
            <!-- 分页部分开始 -->
            <nav aria-label="Page navigation" style="text-align: center;">
                <ul class="pagination">
                    <!-- 这里直接渲染我们后台生成的 HTML 字符串 -->
                    {{ page_string }}
                </ul>
            </nav>
            <!-- 分页部分结束 -->
        </div>
    </div>
{% endblock %}
