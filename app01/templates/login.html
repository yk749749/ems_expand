{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户登录</title>
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-3.4.1/css/bootstrap.min.css' %}">
    <style>
        body {
            background: #f5f5f5;
        }

        .account {
            width: 400px;
            margin: 120px auto;
        }

        .account .panel {
            box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
        }
    </style>
</head>
<body>
<div class="account">
    <div class="panel panel-default">
        <div class="panel-heading">
            <h3 class="panel-title" style="text-align: center;">用户登录</h3>
        </div>
        <div class="panel-body">
            <form method="post" novalidate>
                {% csrf_token %}

                <div class="form-group">
                    <label for="id_username">用户名</label>
                    <input type="text" class="form-control" id="id_username" name="username"
                           placeholder="用户名" value="{{ username }}" autofocus>
                </div>

                <div class="form-group">
                    <label for="id_password">密码</label>
                    <input type="password" class="form-control" id="id_password" name="password"
                           placeholder="密码">
                </div>

                <div class="form-group">
                    <label for="id_code">图片验证码</label>
                    <div style="display: flex; align-items: center;">
                        <input type="text" class="form-control" id="id_code" name="code"
                               placeholder="验证码" maxlength="5" autocomplete="off"
                               style="flex: 1;">
                        <img src="/image/code/" id="image-code" alt="验证码"
                             width="120" height="30" title="点击刷新"
                             style="margin-left: 10px; cursor: pointer;"
                             onclick="this.src='/image/code/?t=' + Date.now();">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">登 录</button>
                <span style="color: red; margin-left: 10px;">{{ error }}</span>
            </form>
        </div>
    </div>
</div>
</body>
</html>
